<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Harvest — an original arcade game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a18; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; background: #070a18; touch-action: none;
    width: min(100vw, calc(100vh * 1.5)); height: min(100vh, calc(100vw / 1.5)); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"
    aria-label="Nova Harvest: steer your harvester, collect stardust, dodge void shards"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
